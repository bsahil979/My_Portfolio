<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="flame" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="emberCore" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
  </defs>
  <!-- Night Sky Backdrop -->
  <circle cx="16" cy="16" r="15" fill="#040711" stroke="#ff7b25" stroke-width="1.2"/>
  <!-- Campfire Logs -->
  <line x1="8" y1="26" x2="24" y2="23" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="23" x2="24" y2="26" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Flame -->
  <path d="M16 5 C16 5, 23 13, 23 19 C23 23, 19.8 25, 16 25 C12.2 25, 9 23, 9 19 C9 14.5, 13.5 10.5, 14 8 C14.5 11, 16 11, 16 5 Z" fill="url(#flame)"/>
  <!-- Inner Glow Core -->
  <ellipse cx="16" cy="20" rx="3.5" ry="4.5" fill="url(#emberCore)"/>
  <!-- Sparks -->
  <circle cx="19" cy="8" r="1" fill="#fef08a"/>
  <circle cx="12" cy="10" r="0.8" fill="#f59e0b"/>
</svg>
