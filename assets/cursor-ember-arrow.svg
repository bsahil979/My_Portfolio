<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <defs>
    <linearGradient id="arrowFlame" x1="2" y1="2" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="30%" stop-color="#ffb703" />
      <stop offset="70%" stop-color="#ff7b25" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="emberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <g filter="url(#emberGlow)">
    <!-- Main Arrowhead Path -->
    <path d="M3 2 L19 14.5 L12 15.5 L15.5 23.5 L12 25 L8.5 17 L2.5 20.5 Z" 
          fill="url(#arrowFlame)" 
          stroke="#060913" 
          stroke-width="1.75" 
          stroke-linejoin="round" />

    <!-- Inner Moonlight Facet -->
    <path d="M4.5 4 L14 12 L10 12.8 L4.5 4 Z" 
          fill="#ffffff" 
          fill-opacity="0.55" />

    <!-- Sparkling Tip Spark -->
    <circle cx="3" cy="2" r="1.5" fill="#ffffff" />
  </g>
</svg>
